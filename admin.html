<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Election Admin Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        main {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 14px;
        }

        #logoutButton {
            background: white;
            color: #111827;
        }

        #saveButton {
            background: #111827;
            color: white;
            width: 100%;
            padding: 13px;
            font-weight: 600;
        }

        #saveButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #returnButton {
            background: #111827;
            color: white;
        }

        .success {
            color: #166534;
            background: #dcfce7;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .error {
            color: #991b1b;
            background: #fee2e2;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            background: #e5e7eb;
        }

        [hidden] {
            display: none !important;
        }

    </style>

</head>

<body>

    <header>

        <h1>Election Admin Dashboard</h1>

        <button id="logoutButton">
            Log Out
        </button>

    </header>


    <main>

        <!-- Loading -->

        <section id="loadingSection">

            <div class="card">

                <h2>Checking access...</h2>

                <p>
                    Please wait while we verify your account.
                </p>

            </div>

        </section>


        <!-- Access denied -->

        <section
            id="deniedSection"
            hidden
        >

            <div class="card">

                <h2>Access Denied</h2>

                <p>
                    You do not have administrator
                    permission for this election.
                </p>

                <button id="returnButton">
                    Return to Login
                </button>

            </div>

        </section>


        <!-- Dashboard -->

        <section
            id="dashboardSection"
            hidden
        >

            <div class="card">

                <h2>Welcome, Administrator</h2>

                <p id="adminEmail"></p>

            </div>


            <!-- Election Settings -->

            <div class="card">

                <h2>Election Settings</h2>

                <p id="message"></p>


                <form id="electionForm">

                    <div class="form-group">

                        <label for="title">
                            Election Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                        ></textarea>

                    </div>


                    <div class="form-group">

                        <label for="startsAt">
                            Start Date & Time
                        </label>

                        <input
                            type="datetime-local"
                            id="startsAt"
                        >

                    </div>


                    <div class="form-group">

                        <label for="endsAt">
                            End Date & Time
                        </label>

                        <input
                            type="datetime-local"
                            id="endsAt"
                        >

                    </div>


                    <div class="form-group">

                        <label for="status">
                            Election Status
                        </label>

                        <select id="status">

                            <option value="draft">
                                Draft
                            </option>

                            <option value="open">
                                Open
                            </option>

                            <option value="closed">
                                Closed
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="resultsPublished">
                            Results Published
                        </label>

                        <select id="resultsPublished">

                            <option value="false">
                                No
                            </option>

                            <option value="true">
                                Yes
                            </option>

                        </select>

                    </div>


                    <button
                        type="submit"
                        id="saveButton"
                    >
                        Save Election Settings
                    </button>

                </form>

            </div>


            <!-- Current information -->

            <div class="card">

                <h2>Current Election Information</h2>

                <p>
                    <strong>Election ID:</strong>
                </p>

                <p id="displayElectionId"></p>

                <p>
                    <strong>Current Status:</strong>
                </p>

                <p id="displayStatus"></p>

            </div>

        </section>

    </main>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- Supabase configuration -->

    <script src="js/supabase.js"></script>


    <!-- Authentication module -->

    <script src="js/auth.js"></script>


    <script>

        /*
         * TEST ELECTION
         *
         * Replace this with your actual
         * Test Election ID.
         */

        const TEST_ELECTION_ID =
            "6a1beb9d-24c7-4741-a128-0a9986210788";


        /*
         * HTML elements
         */

        const loadingSection =
            document.getElementById(
                "loadingSection"
            );

        const dashboardSection =
            document.getElementById(
                "dashboardSection"
            );

        const deniedSection =
            document.getElementById(
                "deniedSection"
            );

        const adminEmail =
            document.getElementById(
                "adminEmail"
            );

        const logoutButton =
            document.getElementById(
                "logoutButton"
            );

        const returnButton =
            document.getElementById(
                "returnButton"
            );

        const electionForm =
            document.getElementById(
                "electionForm"
            );

        const message =
            document.getElementById(
                "message"
            );

        const saveButton =
            document.getElementById(
                "saveButton"
            );


        /*
         * Protect the admin page.
         */

        async function protectAdminPage() {

            const user =
                await getCurrentUser();


            if (!user) {

                window.location.href =
                    "test.html";

                return;
            }


            const isAdmin =
                await isElectionAdmin(
                    TEST_ELECTION_ID
                );


            if (!isAdmin) {

                loadingSection.hidden = true;

                deniedSection.hidden = false;

                return;
            }


            /*
             * Authorized admin.
             */

            loadingSection.hidden = true;

            dashboardSection.hidden = false;

            adminEmail.textContent =
                "Signed in as: " + user.email;


            /*
             * Load the election.
             */

            await loadElection();

        }


        /*
         * Load election settings.
         */

        async function loadElection() {

            const {
                data: election,
                error
            } = await supabaseClient
                .from("elections")
                .select(`
                    id,
                    title,
                    description,
                    starts_at,
                    ends_at,
                    status,
                    results_published
                `)
                .eq("id", TEST_ELECTION_ID)
                .single();


            if (error) {

                console.error(
                    "Election loading error:",
                    error
                );

                showMessage(
                    "Could not load election information.",
                    "error"
                );

                return;
            }


            /*
             * Fill the form.
             */

            document.getElementById(
                "title"
            ).value =
                election.title || "";


            document.getElementById(
                "description"
            ).value =
                election.description || "";


            document.getElementById(
                "startsAt"
            ).value =
                toDateTimeLocal(
                    election.starts_at
                );


            document.getElementById(
                "endsAt"
            ).value =
                toDateTimeLocal(
                    election.ends_at
                );


            document.getElementById(
                "status"
            ).value =
                election.status;


            document.getElementById(
                "resultsPublished"
            ).value =
                election.results_published
                    ? "true"
                    : "false";


            /*
             * Display current information.
             */

            document.getElementById(
                "displayElectionId"
            ).textContent =
                election.id;


            document.getElementById(
                "displayStatus"
            ).textContent =
                election.status;

        }


        /*
         * Convert Supabase timestamp into
         * datetime-local format.
         */

        function toDateTimeLocal(timestamp) {

            if (!timestamp) {
                return "";
            }


            const date =
                new Date(timestamp);


            const year =
                date.getFullYear();


            const month =
                String(
                    date.getMonth() + 1
                ).padStart(2, "0");


            const day =
                String(
                    date.getDate()
                ).padStart(2, "0");


            const hours =
                String(
                    date.getHours()
                ).padStart(2, "0");


            const minutes =
                String(
                    date.getMinutes()
                ).padStart(2, "0");


            return (
                year +
                "-" +
                month +
                "-" +
                day +
                "T" +
                hours +
                ":" +
                minutes
            );

        }


        /*
         * Save election settings.
         */

        electionForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                saveButton.disabled = true;

                saveButton.textContent =
                    "Saving...";

                clearMessage();


                const title =
                    document.getElementById(
                        "title"
                    ).value.trim();


                const description =
                    document.getElementById(
                        "description"
                    ).value.trim();


                const startsAt =
                    document.getElementById(
                        "startsAt"
                    ).value;


                const endsAt =
                    document.getElementById(
                        "endsAt"
                    ).value;


                const status =
                    document.getElementById(
                        "status"
                    ).value;


                const resultsPublished =
                    document.getElementById(
                        "resultsPublished"
                    ).value === "true";


                /*
                 * Basic validation.
                 */

                if (!title) {

                    showMessage(
                        "Election title is required.",
                        "error"
                    );

                    resetSaveButton();

                    return;
                }


                if (
                    startsAt &&
                    endsAt &&
                    new Date(startsAt) >=
                    new Date(endsAt)
                ) {

                    showMessage(
                        "The end time must be after the start time.",
                        "error"
                    );

                    resetSaveButton();

                    return;
                }


                /*
                 * Prepare update.
                 */

                const updates = {

                    title: title,

                    description:
                        description || null,

                    starts_at:
                        startsAt
                            ? new Date(
                                startsAt
                              ).toISOString()
                            : null,

                    ends_at:
                        endsAt
                            ? new Date(
                                endsAt
                              ).toISOString()
                            : null,

                    status: status,

                    results_published:
                        resultsPublished

                };


                /*
                 * Send update to Supabase.
                 */

                const {
                    data,
                    error
                } = await supabaseClient
                    .from("elections")
                    .update(updates)
                    .eq("id", TEST_ELECTION_ID)
                    .select()
                    .single();


                /*
                 * Handle error.
                 */

                if (error) {

                    console.error(
                        "Election update error:",
                        error
                    );

                    showMessage(
                        "Could not save election settings: " +
                        error.message,
                        "error"
                    );

                    resetSaveButton();

                    return;
                }


                /*
                 * Update succeeded.
                 */

                console.log(
                    "Updated election:",
                    data
                );


                showMessage(
                    "Election settings saved successfully.",
                    "success"
                );


                document.getElementById(
                    "displayStatus"
                ).textContent =
                    data.status;


                resetSaveButton();

            }
        );


        /*
         * Display messages.
         */

        function showMessage(
            text,
            type
        ) {

            message.textContent = text;

            message.className = type;

        }


        function clearMessage() {

            message.textContent = "";

            message.className = "";

        }


        function resetSaveButton() {

            saveButton.disabled = false;

            saveButton.textContent =
                "Save Election Settings";

        }


        /*
         * Logout.
         */

        logoutButton.addEventListener(
            "click",
            async () => {

                const success =
                    await logoutUser();


                if (success) {

                    window.location.href =
                        "test.html";

                }

            }
        );


        /*
         * Return to login.
         */

        returnButton.addEventListener(
            "click",
            () => {

                window.location.href =
                    "test.html";

            }
        );


        /*
         * Start application.
         */

        protectAdminPage();

    </script>

</body>

</html>
