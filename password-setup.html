<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1120">

    <title>Set Password | Online Voting</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>
        :root {
            --background: #0b1120;
            --card: #151f32;
            --text: #edf2ff;
            --muted: #a5b2c9;
            --primary: #6d8cff;
            --border: #293750;
            --danger: #ff9a9a;
            --success: #79f0bc;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(ellipse at top, #1b2d4b 0%, transparent 60%),
                var(--background);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 430px;
            padding: 32px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--card);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.3);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        .icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 16px;
            display: grid;
            place-items: center;
            border-radius: 16px;
            background: #25385d;
            color: #a9bcff;
            font-size: 27px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 26px;
        }

        p {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: #0e1728;
            color: var(--text);
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: 0;
            border-radius: 9px;
            background: var(--primary);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #status {
            overflow-wrap: anywhere;
        }

        #status.error {
            color: var(--danger);
        }

        #status.success {
            color: var(--success);
        }

        .back {
            text-align: center;
            margin-top: 22px;
        }

        a {
            color: #a9bcff;
        }

        @media (max-width: 480px) {
            .card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <header>
            <div class="icon" aria-hidden="true">🔐</div>
            <h1>Set Your Password</h1>
            <p>
                Choose a secure password for your Online Voting account.
            </p>
        </header>

        <form id="passwordForm">
            <label for="password">New password</label>
            <input
                id="password"
                type="password"
                autocomplete="new-password"
                minlength="10"
                placeholder="At least 10 characters"
                required
            >

            <label for="confirmPassword">Confirm new password</label>
            <input
                id="confirmPassword"
                type="password"
                autocomplete="new-password"
                minlength="10"
                placeholder="Enter the same password again"
                required
            >

            <button id="saveButton" type="submit">
                Save Password
            </button>
        </form>

        <p id="status" role="status" aria-live="polite"></p>

        <div class="back">
            <a href="index.html">Return to sign in</a>
        </div>
    </main>

    <script>
        const form = document.getElementById("passwordForm");
        const passwordInput = document.getElementById("password");
        const confirmInput = document.getElementById("confirmPassword");
        const saveButton = document.getElementById("saveButton");
        const statusElement = document.getElementById("status");

        function showStatus(message, type = "") {
            statusElement.textContent = message;
            statusElement.className = type;
        }

        let recoverySessionReady = false;

        async function initialisePasswordPage() {
            try {
                /*
                 * The Supabase client should process the authentication
                 * link's URL automatically when detectSessionInUrl is
                 * enabled in supabase.js (the default).
                 */
                const { data, error } =
                    await supabaseClient.auth.getSession();

                if (error) {
                    throw error;
                }

                if (!data.session) {
                    showStatus(
                        "No active password-reset session was found. " +
                        "Please request a fresh password-reset link from " +
                        "the sign-in page.",
                        "error"
                    );
                    return;
                }

                recoverySessionReady = true;
                showStatus("You can now choose your password.");
            } catch (error) {
                console.error("Password page initialisation failed:", error);

                showStatus(
                    "We couldn't verify your link. Please request a new one.",
                    "error"
                );
            }
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (!recoverySessionReady) {
                showStatus(
                    "Your secure link has not been verified. Request a new link.",
                    "error"
                );
                return;
            }

            const password = passwordInput.value;
            const confirmation = confirmInput.value;

            if (password.length < 10) {
                showStatus(
                    "Choose a password with at least 10 characters.",
                    "error"
                );
                return;
            }

            if (password !== confirmation) {
                showStatus(
                    "The passwords do not match.",
                    "error"
                );
                return;
            }

            saveButton.disabled = true;
            saveButton.textContent = "Saving…";

            try {
                const { error } = await supabaseClient.auth.updateUser({
                    password: password
                });

                if (error) {
                    throw error;
                }

                showStatus(
                    "Your password has been saved. You can now sign in.",
                    "success"
                );

                form.reset();

                setTimeout(() => {
                    window.location.replace("index.html");
                }, 1800);

            } catch (error) {
                console.error("Password update failed:", error);

                showStatus(
                    "We couldn't update your password. The link may have " +
                    "expired. Return to sign in and request a fresh link.",
                    "error"
                );
            } finally {
                saveButton.disabled = false;
                saveButton.textContent = "Save Password";
            }
        });

        initialisePasswordPage();
    </script>
</body>
</html>
